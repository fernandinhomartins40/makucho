# ============================================================
# MAKUCHO - Producao (VPS compartilhada)
#
# ARQUITETURA DE PORTAS
#   Uma unica porta publicada no host: 127.0.0.1:${DEPLOY_PORT}
#   Todo o resto vive na rede interna e nao e alcancavel de fora:
#       web   :3000   Next.js
#       api   :3001   NestJS
#       postgres:5432
#
#   Internet -> nginx do host (TLS) -> 127.0.0.1:3096 -> nginx interno
#                                                        |-- /      web:3000
#                                                        |-- /api   api:3001
#                                                        +-- /files volume de midia
#
# MEMORIA
#   A VPS hospeda ~12 aplicacoes e nao tem swap. Todo servico declara
#   mem_limit para que um pico do MAKUCHO nao mate o app de outro cliente.
# ============================================================

name: makucho

services:
  # ---------------- Roteador: unica porta exposta ----------------
  nginx:
    image: nginx:1.27-alpine
    container_name: makucho-nginx
    restart: unless-stopped
    # O bind em 127.0.0.1 e deliberado: so o nginx do host alcanca esta porta.
    ports:
      - '127.0.0.1:${DEPLOY_PORT:-3096}:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - media_data:/var/www/media:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/nginx-health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 96m
    networks:
      - makucho-net

  # ---------------- Frontend (Next.js) ----------------
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-MAKUCHO}
    image: makucho-web:${RELEASE:-latest}
    container_name: makucho-web
    restart: unless-stopped
    # Sem "ports": apenas a rede interna enxerga a 3000.
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      # No servidor o Next fala com a API pelo nome do servico,
      # sem sair para a internet.
      INTERNAL_API_URL: http://api:3001/api
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_APP_URL}
      NEXT_PUBLIC_SITE_NAME: ${NEXT_PUBLIC_SITE_NAME:-MAKUCHO}
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 448m
    networks:
      - makucho-net

  # ---------------- Backend (NestJS) ----------------
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: makucho-api:${RELEASE:-latest}
    container_name: makucho-api
    restart: unless-stopped
    expose:
      - '3001'
    environment:
      NODE_ENV: production
      API_PORT: '3001'
      API_PREFIX: api
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: 'true'
      CORS_ORIGINS: ${CORS_ORIGINS}
      # nginx do host + nginx do compose = 2 saltos ate o IP real do visitante
      TRUST_PROXY_HOPS: '2'
      # Imagens no proprio volume; o nginx interno as entrega em /files,
      # direto do disco, sem passar por processo nenhum.
      STORAGE_PROVIDER: disk
      STORAGE_DISK_PATH: /app/storage/media
      STORAGE_PUBLIC_URL: ${PUBLIC_APP_URL}/files
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      ANALYTICS_SESSION_SALT: ${ANALYTICS_SESSION_SALT}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Administrador MAKUCHO}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - media_data:/app/storage/media
    mem_limit: 512m
    networks:
      - makucho-net

  # ---------------- Banco de dados ----------------
  postgres:
    image: postgres:16-alpine
    container_name: makucho-postgres
    restart: unless-stopped
    # Sem "ports": inacessivel de fora da rede do compose.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 384m
    networks:
      - makucho-net

networks:
  makucho-net:
    driver: bridge
    name: makucho-net

volumes:
  postgres_data:
    name: makucho-postgres-data
  # Imagens do CMS. Montado na api para escrita e no nginx, so leitura,
  # para entrega direta do disco.
  media_data:
    name: makucho-media-data
  nginx_logs:
    name: makucho-nginx-logs
