# ============================================================
# MAKUCHO - Nginx interno do container
#
# Unica porta publica do stack. Recebe do Nginx do host e roteia
# dentro da rede Docker privada:
#     /      -> web:3000  (Next.js)
#     /api/  -> api:3001  (NestJS)
#     /files -> volume de midia, servido do disco (imagens)
#
# web e api NAO publicam portas no host: so existem nesta rede.
# ============================================================

user nginx;
# 2 vCPUs na VPS; "auto" acompanha o que o cgroup permitir.
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # O IP real chega do Nginx do host; sem isto o log registraria
    # apenas o IP interno da rede Docker.
    log_format main '$http_x_forwarded_for - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_max_body_size 20m;
    client_body_timeout  60s;
    client_header_timeout 60s;

    # ---------- Compressao ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/rss+xml application/atom+xml
        image/svg+xml font/woff font/woff2;

    # ---------- Cabecalhos de seguranca (secao 39) ----------
    # HSTS fica no Nginx do host, que e quem termina o TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # ---------- Mapas auxiliares ----------
    # "upgrade" so quando o cliente pede WebSocket; nas demais fica vazio,
    # permitindo o keepalive com os upstreams.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # O Nginx do host termina o TLS e envia X-Forwarded-Proto. Se vier vazio
    # (acesso direto a porta interna), assumimos https para o Next nao gerar
    # links http:// em producao.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      'https';
    }

    # ---------- Upstreams (rede interna do Docker) ----------
    upstream makucho_web {
        server web:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream makucho_api {
        server api:3001 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
