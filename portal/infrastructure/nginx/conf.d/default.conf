# ============================================================
# Roteamento interno do MAKUCHO
# Escuta em 80 dentro do container; o host mapeia 127.0.0.1:3096.
# ============================================================

# Limites de requisicao (secao 39). Zonas compartilhadas entre workers.
limit_req_zone $binary_remote_addr zone=makucho_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=makucho_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=makucho_web:10m rate=60r/s;

server {
    listen 80 default_server;
    server_name _;

    # Sem isto o Next.js gera links com "web:3000" nas paginas.
    absolute_redirect off;

    # ---------- Healthcheck ----------
    # Responde sem tocar em web/api: serve para o deploy saber
    # que o roteador subiu, mesmo se a aplicacao ainda estiver iniciando.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- API (NestJS) ----------
    # Autenticacao com limite mais rigido: 5 tentativas por minuto.
    location ^~ /api/auth/ {
        limit_req zone=makucho_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://makucho_api;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /api/ {
        limit_req zone=makucho_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://makucho_api;
        include /etc/nginx/proxy_params.conf;

        # Upload de imagem no CMS: precisa de mais tempo e sem bufferizar
        # o corpo, para o Nest receber o stream conforme chega.
        client_max_body_size 20m;
        proxy_request_buffering off;
    }

    # Documentacao Swagger da API
    location ^~ /docs {
        proxy_pass http://makucho_api;
        include /etc/nginx/proxy_params.conf;
    }

    # ---------- Imagens ----------
    # Entregues direto do volume, sem passar por processo nenhum: e mais
    # rapido que proxiar um servidor de objetos e nao custa memoria.
    # Mesmo dominio da aplicacao, o que evita CORS e mantem tudo em HTTPS.
    location ^~ /files/ {
        alias /var/www/media/;

        # As imagens tem hash no nome, entao podem ser cacheadas para sempre.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # O diretorio guarda apenas imagens geradas pelo pipeline; nao ha
        # o que listar nem o que executar.
        autoindex off;
        try_files $uri =404;

        access_log off;
    }

    # ---------- Assets estaticos do Next.js ----------
    # Nomes com hash: cache agressivo e seguro.
    location ^~ /_next/static/ {
        proxy_pass http://makucho_web;
        include /etc/nginx/proxy_params.conf;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Imagens otimizadas pelo next/image
    location ^~ /_next/image {
        proxy_pass http://makucho_web;
        include /etc/nginx/proxy_params.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- Frontend (Next.js) ----------
    location / {
        limit_req zone=makucho_web burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://makucho_web;
        include /etc/nginx/proxy_params.conf;
    }

    # ---------- Paginas de erro ----------
    # Se o Next cair, devolve texto simples em vez da pagina do nginx.
    error_page 502 503 504 /_makucho_offline;
    location = /_makucho_offline {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>MAKUCHO</title><body style="font-family:system-ui;background:#0A1A3C;color:#fff;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h1 style="color:#1E5AFF">MAKUCHO</h1><p>Estamos voltando em instantes.</p></div>';
    }
}
