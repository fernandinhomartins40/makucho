# Cabecalhos repassados em todo proxy_pass.
# Sem estes, a aplicacao enxerga o IP do nginx e monta URLs http://.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Preserva a cadeia vinda do Nginx do host (o IP original do visitante)
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Definido no map do nginx.conf: assume "https" quando o host nao informa,
# senao o Next.js montaria URLs http:// atras do proxy TLS.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE. $connection_upgrade vem do map: vale "upgrade" quando o
# cliente pede upgrade e "" nas demais, o que preserva o keepalive.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
# 120s cobre upload de imagem grande e o processamento do Sharp.
proxy_send_timeout    120s;
proxy_read_timeout    120s;

proxy_buffering on;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
