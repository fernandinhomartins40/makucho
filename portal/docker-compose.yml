# ============================================================
# MAKUCHO - Servicos de apoio ao desenvolvimento
#
# So o banco: a API e o frontend rodam na maquina, com "pnpm dev".
# As imagens ficam em apps/api/storage/media e a propria API as serve
# em /files enquanto se desenvolve; em producao quem entrega e o nginx.
# ============================================================

name: makucho

services:
  # ---------------- Banco de dados ----------------
  postgres:
    image: postgres:16-alpine
    container_name: makucho-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-makucho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-makucho_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-makucho}
      # Nao sobrescrever --auth aqui: initdb passaria a usar trust e a senha
      # do usuario nao ficaria em formato SCRAM utilizavel de fora do container.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      # Exposto apenas em dev, para acessar com um cliente SQL local
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-makucho} -d ${POSTGRES_DB:-makucho}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - makucho-net

  # ---------------- Cache / rate limit ----------------
networks:
  makucho-net:
    driver: bridge
    name: makucho-net

volumes:
  postgres_data:
    name: makucho-postgres-data
