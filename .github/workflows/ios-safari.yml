name: Teste no iPhone (Safari do simulador)

# ============================================================
# O editor do Studio no Safari de um iPhone de verdade (o simulador do
# Xcode), sem precisar de Mac nem de iPhone: os executores macOS do GitHub
# já trazem o Xcode com os simuladores. O teste sobe o web (build de
# produção), uma API simulada com um projeto SINTÉTICO (o repositório é
# público: nada de cliente aqui) e dirige o Safari pelo safaridriver.
#
# Roda quando studio/testes/ios/ ou este arquivo mudam, ou à mão. O
# resultado sai como anotações da execução (passos, erros da página e
# prints) e como artefato.
# ============================================================

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'studio/testes/ios/**'
      - '.github/workflows/ios-safari.yml'

concurrency:
  group: ios-safari
  cancel-in-progress: true

jobs:
  safari:
    name: Safari no ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 15: iOS 18. macOS 26: iOS 26, o do iPhone que reportou.
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar o web e os contratos
        run: pnpm install --frozen-lockfile --filter "@makucho/studio-web..."

      - name: Compilar os contratos e o web (build de produção)
        run: |
          pnpm --filter @makucho/studio-contracts build
          cd studio/apps/web
          pnpm build
          # O standalone não leva os estáticos nem o public: copiados ao lado do server.js.
          SERVIDOR=$(dirname $(find .next/standalone -name server.js -path '*apps/web/*' | head -1))
          cp -R .next/static "$SERVIDOR/.next/static"
          cp -R public "$SERVIDOR/public"
          echo "SERVIDOR_DO_WEB=$PWD/$SERVIDOR" >> $GITHUB_ENV

      - name: Vídeo de teste
        run: |
          command -v ffmpeg || brew install ffmpeg
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=480x848:rate=30 -f lavfi -i sine=frequency=330 -t 12 -c:v libx264 -profile:v baseline -pix_fmt yuv420p -c:a aac -shortest studio/testes/ios/proxy.mp4
          ls -la studio/testes/ios/proxy.mp4

      - name: Subir o web e a API simulada
        run: |
          (cd "$SERVIDOR_DO_WEB" && PORT=3000 HOSTNAME=127.0.0.1 nohup node server.js > "$GITHUB_WORKSPACE/web.log" 2>&1 &)
          cd studio/testes/ios
          npm install --no-audit --no-fund
          (VIDEO=proxy.mp4 nohup node servidor.mjs > "$GITHUB_WORKSPACE/servidor.log" 2>&1 &)
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null "http://localhost:8080/editor?projeto=projeto-teste-ios"; then echo "no ar"; break; fi
            sleep 2
          done
          curl -sf -o /dev/null "http://localhost:8080/offline"

      - name: Ligar o simulador e o safaridriver
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | node -e "let t='';process.stdin.on('data',d=>t+=d).on('end',()=>{const d=JSON.parse(t).devices;const ios=Object.keys(d).filter(k=>/iOS/.test(k)).sort().reverse();for(const k of ios){const f=d[k].find(x=>/^iPhone \d+( Pro)?$/.test(x.name))||d[k].find(x=>/^iPhone/.test(x.name));if(f){console.log(f.udid);return}}})")
          echo "simulador: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator
          sudo safaridriver --enable
          (nohup safaridriver -p 4444 > "$GITHUB_WORKSPACE/safaridriver.log" 2>&1 &)
          sleep 3

      - name: O roteiro no Safari do iPhone
        working-directory: studio/testes/ios
        run: node safari.mjs

      - name: Publicar os passos
        if: always()
        working-directory: studio/testes/ios
        run: node publicar.mjs passos

      - name: Publicar os prints
        if: always()
        working-directory: studio/testes/ios
        run: node publicar.mjs fotos

      - name: Registros (web, API simulada, safaridriver)
        if: always()
        run: |
          echo "--- web"; tail -40 web.log || true
          echo "--- servidor"; tail -40 servidor.log || true
          echo "--- safaridriver"; tail -40 safaridriver.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-ios-${{ matrix.runner }}
          path: |
            studio/testes/ios/resultados
            web.log
            servidor.log
            safaridriver.log
