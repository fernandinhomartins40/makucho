name: Deploy Studio

# ============================================================
# MAKUCHO STUDIO - studio.makucho.com.br
#
# TRES ESTAGIOS:
#   preparar  decide o `release` UMA vez e monta a matrix
#   build     cinco imagens EM PARALELO, uma por runner
#   deploy    na VPS, apenas baixa as imagens prontas e sobe
#
# A VPS nao compila nada (ADR 0003).
#
# POR QUE PARALELO
#
# As cinco imagens eram passos sequenciais de um job unico: api, web,
# media, transcription, render, cada uma esperando a anterior sem
# depender dela em nada. Como cada Dockerfile roda o seu proprio
# `pnpm install --frozen-lockfile` (duas vezes: deps e prod-deps),
# eram dez instalacoes do mesmo lockfile em fila indiana.
#
# O gargalo era a transcription, que instala faster-whisper por pip --
# CTranslate2 e centenas de MB. Em serie ela bloqueava o render atras
# dela; em paralelo, o tempo total passa a ser o da imagem mais lenta,
# nao a soma de todas.
#
# O `release` sai do job `preparar` porque leva timestamp: cinco jobs
# gerando cada um o seu produziriam cinco tags diferentes, e o deploy
# nao encontraria o conjunto.
#
# A separacao resolve um problema concreto: o job de deploy recebe do
# build, por output, QUAIS imagens existem. Antes ele tentava baixar
# as tres dos workers sempre -- e uma imagem faltando interrompe o
# download de TODAS as outras, derrubando um deploy que so precisava
# de api, web, redis e nginx (release b9e6f18).
#
# Stack independente do portal (ADR 0001): outra porta, outro projeto
# Compose, outro ciclo. Um render travado aqui nao derruba
# makucho.com.br.
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - 'shared/**'
      - '.github/workflows/deploy-studio.yml'
      - '.github/scripts/provision-host.sh'
      - '.github/scripts/studio-provision-db.sh'
      - '.github/scripts/studio-remote-deploy.sh'
  workflow_dispatch:
    inputs:
      infra_only:
        description: 'Somente infraestrutura (vhost, SSL, banco), sem publicar imagens'
        type: boolean
        default: false

concurrency:
  group: deploy-studio
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/makucho-studio

jobs:
  # ============================================================
  # JOB 1 - Preparar
  #
  # Existe por UMA razao: o `release` precisa ser o mesmo nas cinco
  # imagens. Ele leva timestamp, e cinco jobs paralelos gerando cada
  # um o seu produziriam cinco tags diferentes -- o deploy pediria
  # `abc123-...30` e encontraria `abc123-...31`. Um job so decide, e
  # os outros consomem.
  #
  # Segundos de runner, e destrava o paralelismo dos builds.
  # ============================================================
  preparar:
    name: Preparar release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !inputs.infra_only }}

    outputs:
      release: ${{ steps.meta.outputs.release }}
      apps_ready: ${{ steps.meta.outputs.apps_ready }}
      # Os workers que existem no repositorio, como JSON, para virar a
      # matrix do build. Um worker sem package.json nao entra na
      # matrix -- antes isso era um `if` dentro do script.
      workers: ${{ steps.meta.outputs.workers }}
      workers_ready: ${{ steps.meta.outputs.workers_ready }}

    steps:
      - uses: actions/checkout@v4

      - name: Preparar metadados
        id: meta
        run: |
          set -euo pipefail
          echo "release=$(git rev-parse --short HEAD)-$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

          # Sem esta checagem, um acionamento antes de as aplicacoes
          # existirem falharia dentro do docker build, com erro do pnpm
          # sobre filtro sem resultado -- mensagem que nao explica a causa.
          if [ -f studio/apps/api/package.json ] && [ -f studio/apps/web/package.json ]; then
            echo "apps_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::studio/apps ainda vazio; apenas a infraestrutura sera preparada."
          fi

          # A matrix de workers e montada aqui, a partir do que EXISTE.
          #
          # Publica o que existe, nao "os tres ou nenhum": cada worker
          # tem profile proprio no compose, entao ter so um pronto
          # deixou de ser motivo para nao publicar nenhum.
          itens=''
          prontos=''

          incluir() {
            local nome="$1" dockerfile="$2" sufixo="$3"
            [ -f "studio/workers/${nome}/package.json" ] || return 0
            [ -z "$itens" ] || itens="${itens},"
            itens="${itens}{\"nome\":\"${nome}\",\"dockerfile\":\"${dockerfile}\",\"sufixo\":\"${sufixo}\"}"
            prontos="${prontos}${nome},"
          }

          incluir media         worker-media.Dockerfile         worker
          incluir transcription worker-transcription.Dockerfile whisper
          incluir render        worker-render.Dockerfile        render

          echo "workers=[${itens}]" >> "$GITHUB_OUTPUT"
          echo "workers_ready=${prontos%,}" >> "$GITHUB_OUTPUT"
          echo "::notice::workers na matrix: ${prontos:-nenhum}"

  # ============================================================
  # JOB 2 - Build das aplicacoes (PARALELO)
  #
  # API e Web em runners separados. Antes eram passos sequenciais no
  # mesmo job: o Web esperava a API terminar sem depender dela em
  # nada. Sao dois `pnpm install` e dois `next build`/`tsc` que nao
  # se tocam.
  # ============================================================
  build-app:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preparar]
    if: ${{ !inputs.infra_only && needs.preparar.outputs.apps_ready == 'true' }}

    strategy:
      # `false` para ver TODAS as falhas de uma vez. Com fail-fast, a
      # primeira imagem que quebra cancela as outras quatro, e o
      # proximo deploy descobre o segundo erro -- duas rodadas para
      # informacao que cabia numa.
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: api.Dockerfile
            sufixo: api
          - app: web
            dockerfile: web.Dockerfile
            sufixo: web

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: studio/infrastructure/docker/${{ matrix.dockerfile }}
          push: true
          # Variaveis NEXT_PUBLIC_* sao embutidas no bundle durante o
          # build: precisam existir aqui, nao apenas em runtime. Sao
          # ignoradas pelos Dockerfiles que nao as declaram.
          build-args: |
            NEXT_PUBLIC_STUDIO_URL=https://studio.makucho.com.br
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:${{ needs.preparar.outputs.release }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:latest
          # O cache do registro leva o build de minutos a segundos
          # quando so o codigo mudou. Cada imagem tem o SEU buildcache:
          # compartilhar um so faria as cinco sobrescreverem umas as
          # outras em paralelo, e nenhuma acertaria o cache.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:buildcache,mode=max,ignore-error=true

  # ============================================================
  # JOB 3 - Build dos workers (PARALELO)
  #
  # Separado do job das aplicacoes porque a matrix e DINAMICA: vem do
  # que existe no repositorio, e um worker ainda nao criado nao pode
  # virar um job que falha.
  #
  # O ganho maior esta aqui. A transcription instala faster-whisper
  # por pip, que traz CTranslate2 e centenas de MB -- e de longe a
  # imagem mais lenta. Em serie ela bloqueava o render atras dela; em
  # paralelo os dois terminam quando o mais lento terminar.
  # ============================================================
  build-worker:
    name: Build worker ${{ matrix.nome }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [preparar]
    if: ${{ !inputs.infra_only && needs.preparar.outputs.apps_ready == 'true' && needs.preparar.outputs.workers != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preparar.outputs.workers) }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: studio/infrastructure/docker/${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:${{ needs.preparar.outputs.release }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.sufixo }}:buildcache,mode=max,ignore-error=true

  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [preparar, build-app, build-worker]
    # "always" para que o modo infra_only rode com os builds pulados.
    #
    # A condicao interna exige `success` de TODOS os builds: nenhuma
    # imagem sobe se qualquer uma falhar, e a VPS fica na versao
    # anterior, inteira. Um deploy com a API nova e o worker de
    # transcricao velho pode divergir no contrato da fila -- e esse e
    # o tipo de defeito que aparece como job travado, sem erro claro.
    #
    # `!= 'failure'` e nao `== 'success'` para o build-worker: com a
    # matrix vazia (nenhum worker no repositorio) o job e SKIPPED, e
    # skipped nao pode barrar um deploy de api e web.
    if: >-
      ${{ always() && (inputs.infra_only ||
          (needs.preparar.result == 'success' &&
           needs['build-app'].result == 'success' &&
           needs['build-worker'].result != 'failure')) }}

    environment:
      name: studio-production
      url: https://studio.makucho.com.br

    env:
      VPS_HOST: 72.60.10.108
      VPS_USER: root
      APP_ROOT: /opt/makucho-studio
      # 3096 e do portal; 3097 e a porta unica deste stack.
      DEPLOY_PORT: '3097'
      PRIMARY_DOMAIN: studio.makucho.com.br
      CANONICAL_URL: https://studio.makucho.com.br
      SITE_NAME: makucho-studio
      SSL_EMAIL: admin@makucho.com.br
      SSH_OPTS: -T -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verificar acesso a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "${SSHPASS:-}" ]; then
            echo "::error::secret VPS_PASSWORD vazio ou inexistente." >&2
            exit 1
          fi
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo ok" >/dev/null \
            || { echo "::error::autenticacao SSH falhou; confira o secret VPS_PASSWORD." >&2; exit 1; }

      - name: Enviar infraestrutura para a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          RELEASE='${{ needs.preparar.outputs.release || github.sha }}'
          DIR="${{ env.APP_ROOT }}/releases/${RELEASE}"
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p '$DIR'"

          # So o necessario para subir o stack: compose, nginx interno e
          # scripts. O codigo-fonte ja virou imagem no job anterior.
          tar -czf - \
            studio/docker-compose.prod.yml \
            studio/infrastructure/nginx \
            .github/scripts \
            | sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
                "tar -xzf - -C '$DIR' && chmod +x '$DIR'/.github/scripts/*.sh"

      - name: Preparar banco e segredos
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE='${{ needs.preparar.outputs.release || github.sha }}'
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             STUDIO_DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             STUDIO_DOMAIN='${{ env.PRIMARY_DOMAIN }}' \
             STUDIO_PUBLIC_URL='${{ env.CANONICAL_URL }}' \
             AI_API_KEY='${{ secrets.AI_API_KEY }}' \
             bash '${{ env.APP_ROOT }}/releases/${RELEASE}/.github/scripts/studio-provision-db.sh'"

      - name: Preparar host, vhost e SSL
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE='${{ needs.preparar.outputs.release || github.sha }}'
          # Upload de video, nao de imagem: 520m contra os 20m do
          # portal, e timeout longo para upload em rede movel e para o
          # stream de progresso do job.
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' \
             CANONICAL_URL='${{ env.CANONICAL_URL }}' \
             SITE_NAME='${{ env.SITE_NAME }}' \
             SSL_EMAIL='${{ env.SSL_EMAIL }}' \
             CLIENT_MAX_BODY='520m' \
             PROXY_TIMEOUT='900s' \
             REQUEST_BUFFERING='off' \
             bash '${{ env.APP_ROOT }}/releases/${RELEASE}/.github/scripts/provision-host.sh'"

      - name: Autenticar VPS no GHCR
        if: ${{ !inputs.infra_only && needs.preparar.outputs.apps_ready == 'true' }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O token entra por stdin: como argumento apareceria na lista
          # de processos da VPS. Expira ao fim deste workflow.
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh ${{ env.SSH_OPTS }} \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin"

      - name: Subir o stack
        if: ${{ !inputs.infra_only && needs.preparar.outputs.apps_ready == 'true' }}
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          RELEASE='${{ needs.preparar.outputs.release }}'
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             RELEASE='${RELEASE}' \
             STUDIO_DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             STUDIO_WORKERS='${{ needs.preparar.outputs.workers_ready }}' \
             REGISTRY_IMAGE_STUDIO_API='${{ env.IMAGE_PREFIX }}-api' \
             REGISTRY_IMAGE_STUDIO_WEB='${{ env.IMAGE_PREFIX }}-web' \
             REGISTRY_IMAGE_STUDIO_WORKER='${{ env.IMAGE_PREFIX }}-worker' \
             REGISTRY_IMAGE_STUDIO_WHISPER='${{ env.IMAGE_PREFIX }}-whisper' \
             REGISTRY_IMAGE_STUDIO_RENDER='${{ env.IMAGE_PREFIX }}-render' \
             bash '${{ env.APP_ROOT }}/releases/${RELEASE}/.github/scripts/studio-remote-deploy.sh'"

      - name: Verificar pelo dominio publico
        if: ${{ !inputs.infra_only && needs.preparar.outputs.apps_ready == 'true' }}
        run: |
          set -uo pipefail
          falhou=0

          checar() {
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$1" 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok      $2"
            else
              echo "::error::$2 respondeu HTTP $code" >&2
              falhou=1
            fi
          }

          checar "${{ env.CANONICAL_URL }}/" "studio"
          checar "${{ env.CANONICAL_URL }}/api/health" "api do studio"

          # Os dois stacks dividem VPS e nginx do host: um deploy do
          # studio nao pode derrubar o portal, que esta em producao.
          checar "https://makucho.com.br/" "portal (nao pode quebrar)"

          [ "$falhou" -eq 0 ] || exit 1
          echo "deploy ${{ needs.preparar.outputs.release }} verificado em ${{ env.CANONICAL_URL }}"
