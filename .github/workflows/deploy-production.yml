name: Deploy Production

# ============================================================
# MAKUCHO - makucho.com.br
#
# DOIS JOBS
#   build   compila no runner do GitHub e publica no GHCR
#   deploy  na VPS, apenas baixa a imagem pronta e sobe
#
# A VPS NAO compila nada. O build do Next.js pede ~1,5 GB de RAM e
# varios minutos de CPU: rodando la, disputaria recursos com as
# outras 5 aplicacoes de clientes hospedadas na mesma maquina.
#
# A logica de servidor vive em .github/scripts/*.sh, versionada e
# com sintaxe verificavel, em vez de blocos ssh dentro do YAML.
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'shared/**'
      - '.github/workflows/deploy-production.yml'
      - '.github/scripts/provision-host.sh'
      - '.github/scripts/remote-deploy.sh'
      - '.github/scripts/remote-health-check.sh'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/makucho

jobs:
  # ============================================================
  # JOB 1 - Versao da release
  # Um id unico para API e web: os builds rodam em paralelo e o deploy
  # precisa das duas imagens com a mesma tag.
  # ============================================================
  versao:
    name: Definir versão
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.meta.outputs.release }}
    steps:
      - name: Definir versao da release
        id: meta
        run: echo "release=${GITHUB_SHA::7}-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

  # ============================================================
  # JOB 2 - Build (API e web em paralelo)
  # Antes eram passos sequenciais no mesmo job: o tempo total era a soma
  # dos dois. Em jobs separados o total cai para o do build mais lento.
  # ============================================================
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [versao]
    strategy:
      # Se um build falhar, o outro continua: o cache dele fica pronto para
      # a proxima tentativa. O deploy nao roda sem os dois.
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: api.Dockerfile
            build-args: ''
          - app: web
            dockerfile: web.Dockerfile
            # Variaveis NEXT_PUBLIC_* sao embutidas no bundle durante o
            # build: precisam existir aqui, nao apenas em runtime.
            build-args: |
              NEXT_PUBLIC_SITE_URL=https://makucho.com.br
              NEXT_PUBLIC_API_URL=/api
              NEXT_PUBLIC_SITE_NAME=MAKUCHO

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: portal/infrastructure/docker/${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.versao.outputs.release }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          # O cache do registro leva o build de minutos a segundos
          # quando so o codigo mudou. ignore-error porque no primeiro
          # build o cache ainda nao existe.
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:buildcache,mode=max,ignore-error=true

  # ============================================================
  # JOB 3 - Deploy
  # ============================================================
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [versao, build]

    environment:
      name: production
      url: https://makucho.com.br

    env:
      VPS_HOST: 72.60.10.108
      VPS_USER: root
      APP_ROOT: /opt/makucho
      DEPLOY_PORT: '3096'
      PRIMARY_DOMAIN: makucho.com.br
      SECONDARY_DOMAIN: www.makucho.com.br
      CANONICAL_URL: https://makucho.com.br
      SITE_NAME: makucho
      SSL_EMAIL: admin@makucho.com.br
      SSH_OPTS: -T -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20

    steps:
      - uses: actions/checkout@v4

      - name: Instalar sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verificar acesso a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          if [ -z "${SSHPASS:-}" ]; then
            echo "::error::secret VPS_PASSWORD vazio ou inexistente." >&2
            exit 1
          fi
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo ok" >/dev/null \
            || { echo "::error::autenticacao SSH falhou. Confira o secret VPS_PASSWORD e se PasswordAuthentication/PermitRootLogin estao habilitados em ${{ env.VPS_HOST }}." >&2; exit 1; }

      - name: Enviar infraestrutura para a VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="${{ env.APP_ROOT }}/releases/${{ needs.versao.outputs.release }}"
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "mkdir -p '$DIR'"

          # So o necessario para subir o stack: compose, nginx interno e
          # scripts. O codigo-fonte ja virou imagem no job anterior.
          tar -czf - \
            portal/docker-compose.prod.yml \
            portal/infrastructure/nginx \
            portal/infrastructure/docker/postgres \
            .github/scripts \
            | sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
                "tar -xzf - -C '$DIR' && chmod +x '$DIR'/.github/scripts/*.sh"

      - name: Preparar variaveis de ambiente
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             CANONICAL_URL='${{ env.CANONICAL_URL }}' \
             DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' \
             SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' \
             SEED_ADMIN_EMAIL='${{ secrets.SEED_ADMIN_EMAIL }}' \
             SEED_ADMIN_PASSWORD='${{ secrets.SEED_ADMIN_PASSWORD }}' \
             bash '${{ env.APP_ROOT }}/releases/${{ needs.versao.outputs.release }}/.github/scripts/portal-provision-env.sh'"

      - name: Preparar host, vhost e SSL
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             PRIMARY_DOMAIN='${{ env.PRIMARY_DOMAIN }}' \
             SECONDARY_DOMAIN='${{ env.SECONDARY_DOMAIN }}' \
             CANONICAL_URL='${{ env.CANONICAL_URL }}' \
             SITE_NAME='${{ env.SITE_NAME }}' \
             SSL_EMAIL='${{ env.SSL_EMAIL }}' \
             CLIENT_MAX_BODY='20m' \
             PROXY_TIMEOUT='120s' \
             bash '${{ env.APP_ROOT }}/releases/${{ needs.versao.outputs.release }}/.github/scripts/provision-host.sh'"

      - name: Autenticar VPS no GHCR
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # O token entra por stdin: como argumento apareceria na lista
          # de processos da VPS. Expira ao fim deste workflow.
          printf '%s' "$GHCR_TOKEN" | sshpass -e ssh ${{ env.SSH_OPTS }} \
            ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "docker login ${{ env.REGISTRY }} -u '${{ github.actor }}' --password-stdin"

      - name: Subir o stack
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             RELEASE='${{ needs.versao.outputs.release }}' \
             DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             REGISTRY_IMAGE_WEB='${{ env.IMAGE_PREFIX }}-web' \
             REGISTRY_IMAGE_API='${{ env.IMAGE_PREFIX }}-api' \
             bash '${{ env.APP_ROOT }}/releases/${{ needs.versao.outputs.release }}/.github/scripts/remote-deploy.sh'"

      - name: Health check interno
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sshpass -e ssh ${{ env.SSH_OPTS }} ${{ env.VPS_USER }}@${{ env.VPS_HOST }} \
            "APP_ROOT='${{ env.APP_ROOT }}' \
             DEPLOY_PORT='${{ env.DEPLOY_PORT }}' \
             RELEASE='${{ needs.versao.outputs.release }}' \
             bash '${{ env.APP_ROOT }}/releases/${{ needs.versao.outputs.release }}/.github/scripts/remote-health-check.sh'"

      - name: Verificar pelo dominio publico
        run: |
          set -uo pipefail
          falhou=0

          # O health check anterior fala com 127.0.0.1 e enxergaria tudo
          # "no ar" mesmo com o site inacessivel de fora -- por exemplo
          # se o dominio caisse no certificado de outro projeto da VPS.
          # Este passo atravessa DNS, TLS e nginx de verdade.
          assunto="$(echo | openssl s_client -connect "${{ env.PRIMARY_DOMAIN }}:443" \
            -servername "${{ env.PRIMARY_DOMAIN }}" 2>/dev/null \
            | openssl x509 -noout -subject 2>/dev/null || true)"
          echo "certificado servido: $assunto"
          if ! printf '%s' "$assunto" | grep -q "${{ env.PRIMARY_DOMAIN }}"; then
            echo "::error::a porta 443 esta servindo certificado de outro dominio." >&2
            falhou=1
          fi

          checar() {
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$1" 2>/dev/null || echo 000)"
            if [ "$code" = "200" ]; then
              echo "  ok      $2"
            else
              echo "::error::$2 respondeu HTTP $code" >&2
              falhou=1
            fi
          }

          checar "${{ env.CANONICAL_URL }}/" "portal publico"
          checar "${{ env.CANONICAL_URL }}/api/health" "api"

          [ "$falhou" -eq 0 ] || exit 1
          echo "deploy ${{ needs.versao.outputs.release }} verificado em ${{ env.CANONICAL_URL }}"
