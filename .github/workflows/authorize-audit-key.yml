name: Authorize audit key

# ============================================================
# Autoriza uma chave publica de auditoria na VPS.
#
# Existe porque a maquina de quem opera nao tem a senha de root em
# maos -- ela vive como secret aqui. Este workflow usa o mesmo
# VPS_PASSWORD do deploy para instalar a chave, e nada mais.
#
# Temporario: remover quando a auditoria terminar, junto com a
# revogacao da chave na VPS (ver o passo final da saida).
# ============================================================

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'IP da VPS'
        required: true
        default: '72.60.10.108'
      public_key:
        description: 'Chave publica a autorizar (linha unica)'
        required: true

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize key on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Validate public key format
        env:
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail

          # Aceita apenas chave publica de tipo conhecido, em uma linha.
          # Sem isto, um valor arbitrario acabaria dentro do
          # authorized_keys do root -- inclusive com opcoes de comando.
          if ! printf '%s' "$PUBLIC_KEY" | grep -qE '^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+) [A-Za-z0-9+/=]+( [^\n]*)?$'; then
            echo "::error::Formato invalido. Esperado: '<tipo> <base64> [comentario]' em uma linha." >&2
            exit 1
          fi

          if printf '%s' "$PUBLIC_KEY" | grep -qE 'BEGIN (OPENSSH|RSA|EC) PRIVATE KEY'; then
            echo "::error::Isto e uma chave PRIVADA. Envie apenas a publica (.pub)." >&2
            exit 1
          fi

          echo "Formato validado."

      - name: Authorize key
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
          PUBLIC_KEY: ${{ inputs.public_key }}
          VPS_HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail

          if [ -z "${SSHPASS:-}" ]; then
            echo "::error::secret VPS_PASSWORD vazio ou inexistente." >&2
            exit 1
          fi

          SSH_OPTS="-o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1 -o ConnectTimeout=20"

          # A chave entra por stdin, nao como argumento: um argumento
          # apareceria no "ps" da VPS enquanto o comando roda.
          printf '%s\n' "$PUBLIC_KEY" | sshpass -e ssh $SSH_OPTS "root@${VPS_HOST}" \
            'set -euo pipefail
             mkdir -p /root/.ssh
             chmod 700 /root/.ssh
             touch /root/.ssh/authorized_keys
             chmod 600 /root/.ssh/authorized_keys
             read -r key
             # Idempotente: reexecutar nao duplica a linha.
             if grep -qF "$key" /root/.ssh/authorized_keys; then
               echo "chave ja autorizada"
             else
               printf "%s\n" "$key" >> /root/.ssh/authorized_keys
               echo "chave adicionada"
             fi
             echo "total de chaves autorizadas: $(grep -c . /root/.ssh/authorized_keys)"'

      - name: Reminder
        run: |
          echo "Para revogar depois, rode na VPS:"
          echo "  sed -i '/makucho-audit-readonly/d' /root/.ssh/authorized_keys"
