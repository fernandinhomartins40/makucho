# Cabecalhos repassados em todo proxy_pass.
# Sem estes, a aplicacao enxerga o IP do nginx e monta URLs http://.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Preserva a cadeia vinda do Nginx do host (o IP original do visitante)
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Definido no map do nginx.conf: assume "https" quando o host nao informa,
# senao o Next.js montaria URLs http:// atras do proxy TLS.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;

# WebSocket / SSE. $connection_upgrade vem do map: vale "upgrade" quando o
# cliente pede upgrade e "" nas demais, o que preserva o keepalive.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;

# proxy_send_timeout e proxy_read_timeout NAO ficam aqui.
#
# O nginx recusa a diretiva duplicada no mesmo nivel, entao um location
# que precise de um valor maior nao conseguiria sobrescrever o desta
# lista — a config inteira falha no teste. Cada location define os dois
# conforme a sua necessidade: upload e SSE precisam de minutos; o
# restante herda o default do http (60s), definido no nginx.conf.

# proxy_buffering e os buffers tambem ficam fora: a rota de SSE precisa
# desliga-lo, e uma diretiva repetida no mesmo nivel quebra a config.
# Os defaults estao no bloco http do nginx.conf, de onde cada location
# herda — e onde o SSE pode sobrescrever sem conflito.
