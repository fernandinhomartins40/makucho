# ============================================================
# MAKUCHO STUDIO - Nginx interno do container
#
# Unica porta publica do stack do studio. Recebe do Nginx do host
# (studio.makucho.com.br) e roteia na rede Docker privada:
#     /      -> studio-web:3000  (Next.js PWA)
#     /api/  -> studio-api:3001  (NestJS)
#
# Stack separado do portal (ADR 0001): um render travado aqui nao
# derruba makucho.com.br.
# ============================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$http_x_forwarded_for - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;

    # Upload de video, nao de imagem: o teto do portal (20m) recusaria
    # qualquer gravacao real. O limite de produto sao 500 MB (ADR 0003);
    # a folga cobre o overhead do multipart.
    client_max_body_size 520m;
    # Upload de celular em rede movel e lento; 60s abortaria no meio.
    client_body_timeout  300s;
    client_header_timeout 60s;

    # ---------- Compressao ----------
    # Video e audio ja vem comprimidos: recomprimir gasta CPU que, nesta
    # VPS, faz falta ao render (ADR 0003).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        image/svg+xml font/woff font/woff2;

    # ---------- Cabecalhos de seguranca ----------
    # HSTS fica no Nginx do host, que termina o TLS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    # camera e microfone LIBERADOS no proprio dominio: o Record Studio
    # grava pelo navegador (plano, fase 3). A politica do portal bloqueia
    # os dois, e herda-la aqui quebraria o teleprompter silenciosamente.
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), interest-cohort=()" always;

    # ---------- Defaults de proxy ----------
    # Aqui, e nao no proxy_params.conf: definidas no nivel http, cada
    # location as herda e pode sobrescrever uma delas isoladamente. Numa
    # lista incluida por location, a repeticao seria duplicata e o nginx
    # recusaria a configuracao inteira.
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    # Timeouts conservadores por padrao; upload e SSE os ampliam.
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      'https';
    }

    upstream studio_web {
        server studio-web:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    upstream studio_api {
        server studio-api:3001 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
