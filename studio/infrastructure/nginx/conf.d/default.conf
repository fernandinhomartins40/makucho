# ============================================================
# Roteamento interno do MAKUCHO STUDIO
# Escuta em 80 dentro do container; o host mapeia 127.0.0.1:3097.
# ============================================================

# Limites por zona. O upload e o mais generoso porque um video sobe em
# varias requisicoes multipart; a autenticacao, o mais rigido.
limit_req_zone $binary_remote_addr zone=studio_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=studio_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=studio_upload:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=studio_web:10m rate=60r/s;

server {
    listen 80 default_server;
    server_name _;

    absolute_redirect off;

    # ---------- Healthcheck ----------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- Autenticacao ----------
    location ^~ /api/auth/ {
        limit_req zone=studio_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://studio_api;
        include /etc/nginx/proxy_params.conf;
    }

    # ---------- Upload de video ----------
    #
    # Separado da API geral por tres motivos, todos praticos:
    #   - corpo de ate 500 MB, contra os 20 MB do resto;
    #   - sem bufferizar: o Nest recebe o stream conforme chega, em vez
    #     de o nginx gravar o arquivo inteiro em disco antes de repassar
    #     — nesta VPS, o disco temporario e recurso escasso (ADR 0003);
    #   - timeout longo: upload de celular em 4G leva minutos.
    location ^~ /api/projects/ {
        limit_req zone=studio_upload burst=20 nodelay;
        limit_req_status 429;

        # Antes do include: as diretivas abaixo tem precedencia sobre as
        # do proxy_params, que nao sao reaplicadas neste nivel.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass http://studio_api;
        include /etc/nginx/proxy_params.conf;

        client_max_body_size 520m;
        proxy_request_buffering off;
    }

    # ---------- Progresso de job (SSE) ----------
    #
    # O acompanhamento das etapas ("analisando fala...") e um stream
    # aberto. Com proxy_buffering ligado o nginx segura os eventos e o
    # usuario ve a tela parada durante todo o processamento.
    location ^~ /api/events/ {
        # Um render pode levar varios minutos nesta VPS; o stream nao
        # pode expirar antes dele. Antes do include, pelo mesmo motivo
        # da rota de upload.
        proxy_read_timeout 900s;

        proxy_pass http://studio_api;
        include /etc/nginx/proxy_params.conf;

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # ---------- API ----------
    location ^~ /api/ {
        limit_req zone=studio_api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://studio_api;
        include /etc/nginx/proxy_params.conf;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ^~ /docs {
        proxy_pass http://studio_api;
        include /etc/nginx/proxy_params.conf;
    }

    # ---------- Midia servida do disco ----------
    #
    # Proxies e renders concluidos, entregues direto do volume — sem
    # passar por processo nenhum. Streaming de video e exatamente o caso
    # em que isso importa: o Node ficaria ocupado empurrando bytes.
    location ^~ /media/ {
        alias /var/www/studio-media/;

        # Necessario para o player buscar posicao no video sem baixar
        # o arquivo inteiro.
        add_header Accept-Ranges bytes always;
        add_header X-Content-Type-Options "nosniff" always;

        # Nomes com hash; o conteudo nunca muda no mesmo caminho.
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;

        autoindex off;
        try_files $uri =404;
        access_log off;
    }

    # ---------- Assets do Next.js ----------
    location ^~ /_next/static/ {
        proxy_pass http://studio_web;
        include /etc/nginx/proxy_params.conf;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location ^~ /_next/image {
        proxy_pass http://studio_web;
        include /etc/nginx/proxy_params.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------- Service worker ----------
    #
    # Nunca cacheado: um sw.js preso no cache do navegador mantem a
    # versao antiga do PWA instalada mesmo depois do deploy.
    location = /sw.js {
        proxy_pass http://studio_web;
        include /etc/nginx/proxy_params.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /manifest.webmanifest {
        proxy_pass http://studio_web;
        include /etc/nginx/proxy_params.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ---------- Frontend ----------
    location / {
        limit_req zone=studio_web burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://studio_web;
        include /etc/nginx/proxy_params.conf;
    }

    # ---------- Pagina de erro ----------
    error_page 502 503 504 /_studio_offline;
    location = /_studio_offline {
        internal;
        default_type text/html;
        return 503 '<!doctype html><meta charset="utf-8"><title>MAKUCHO Studio</title><body style="font-family:system-ui;background:#0A1A3C;color:#fff;display:grid;place-items:center;height:100vh;margin:0"><div style="text-align:center"><h1 style="color:#1E5AFF">MAKUCHO Studio</h1><p>Estamos voltando em instantes.</p></div>';
    }
}
